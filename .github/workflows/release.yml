name: Publish installable packages

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify release version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('plugin/plugin.json').read_text())['version']
          claude_version = json.loads(Path('plugin/.claude-plugin/plugin.json').read_text())['version']
          assert version == claude_version, 'Plugin manifest versions must match'
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match the plugin version'
          PY
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --prefix connector
      - name: Validate skills and recorded evidence
        run: |
          ./scripts/validate-repository.sh
          python -m unittest discover -s tests -v
          python scripts/worked_examples.py
          python scripts/check_evaluation_evidence.py
      - name: Test and build the connector
        working-directory: connector
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Build installable packages
        run: |
          python scripts/package_skill.py --all
          python scripts/package_plugin.py
          python scripts/package_plugin.py --target skills-only
      - name: Verify extracted plugin runtimes
        working-directory: connector
        run: npm run test:package
      - name: Prepare release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          section = Path('CHANGELOG.md').read_text().split('### Assigned-job workflow readiness\n', 1)[1].split('\n### ', 1)[0]
          Path('dist/release-notes.md').write_text(
              '# Shopify VA Toolkit\n\n'
              'Nineteen existing skills with clearer prerequisites, decision gates, QA, recovery, and client handoffs.\n\n'
              '## Downloads\n\n'
              '- `shopify-va-toolkit-skills-only.plugin`: all 19 skills for hosts that cannot run a local MCP process.\n'
              '- `shopify-va-toolkit.plugin`: all 19 skills plus the bundled local read-only MCP runtime; requires Node.js 24+.\n'
              '- Individual `shopify-*.zip` files: install one specialist skill.\n\n'
              'Import the selected package using your host\'s supported installation flow. Existing installations must be updated or reimported. '
              'Packages do not deploy a hosted connector or connect a Shopify store automatically.\n\n'
              '## Changes\n' + section + '\n'
          )
          PY
      - name: Publish GitHub release and downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.plugin dist/*.zip \
            --verify-tag --title "Shopify VA Toolkit $RELEASE_TAG" \
            --notes-file dist/release-notes.md
